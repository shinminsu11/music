<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천지인 밀기 자판 (연속 두 번 밀기)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #1a1a1a; margin: 0; user-select: none; }
        .container { background: #2c2c2c; padding: 12px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 360px; box-sizing: border-box; }
        #output { width: 100%; height: 60px; font-size: 24px; padding: 10px; margin-bottom: 15px; border: none; border-radius: 8px; background-color: #383838; color: white; box-sizing: border-box; }
        
        .grid-layout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .hidden { display: none !important; }
        
        .key { height: 65px; background: #424242; border: 1px solid #2e2e2e; border-radius: 6px; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; }
        .sub-key { background: #334155; color: #38bdf8; font-size: 18px; }
        
        /* 클립보드 전용 영역 */
        .list-container { grid-column: span 4; height: 170px; overflow-y: auto; background: #222; padding: 4px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
        .item { width: 100%; height: 45px; min-height: 45px; background: #1e293b; color: #e2e8f0; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; cursor: pointer; flex-shrink: 0; font-size: 14px; }
        
        .clip-action-group { grid-column: span 4; display: flex; gap: 6px; margin-bottom: 6px; }
        .clip-btn { flex: 1; height: 45px; border-radius: 6px; border: none; color: white; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-fetch { background: #0284c7; }
        .btn-add { background: #0d9488; }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="output" placeholder="자판 테스트" autofocus>

        <!-- 1. 메인 자판 -->
        <div class="grid-layout" id="mainBoard">
            <div class="key" onclick="typeKey('○')">○ㅎ</div>
            <div class="key" onclick="typeKey('ㄱ')">ㄱㅋ</div>
            <div class="key" onclick="typeKey('|')">|</div>
            <div class="key" onclick="backspaceKey()">⌫</div>
            <div class="key" onclick="typeKey('ㄴ')">ㄴㄹ</div>
            <div class="key" onclick="typeKey('ㄷ')">ㄷㅌ</div>
            <div class="key" id="dotKey" style="background:#363636; border:1px dashed #777">•</div>
            <div class="key" onclick="switchBoard('symbol')">⚙️</div>
            <div class="key" onclick="typeKey('ㅅ')">ㅅ</div>
            <div class="key" onclick="typeKey('ㅈ')">ㅈㅊ</div>
            <div class="key" onclick="typeKey('—')">—</div>
            <div class="key" onclick="typeKey('A')">A</div>
            <div class="key" onclick="switchBoard('clipboard')">📋</div>
            <div class="key" onclick="switchBoard('phrases')">📝</div>
            <div class="key" onclick="typeKey(' ')">␣</div>
            <div class="key" onclick="backspaceKey()">⌫</div>
        </div>

        <!-- 2. 기호판 -->
        <div class="grid-layout hidden" id="symbolBoard">
            <div class="key sub-key" onclick="typeKey('!')">!</div>
            <div class="key sub-key" onclick="typeKey('@')">@</div>
            <div class="key sub-key" onclick="typeKey('#')">#</div>
            <div class="key sub-key" onclick="typeKey('$')">$</div>
            <div class="key sub-key" onclick="typeKey('%')">%</div>
            <div class="key sub-key" onclick="typeKey('^')">^</div>
            <div class="key sub-key" onclick="typeKey('&')">&</div>
            <div class="key sub-key" onclick="typeKey('*')">*</div>
            <div class="key sub-key" onclick="typeKey('(')">(</div>
            <div class="key sub-key" onclick="typeKey(')')">)</div>
            <div class="key sub-key" onclick="typeKey('+')">+</div>
            <div class="key sub-key" onclick="typeKey('-')">-</div>
            <div class="key" style="background: #4a5568;" onclick="backspaceKey()">⌫</div>
            <div class="key sub-key" onclick="typeKey('?')">?</div>
            <div class="key sub-key" onclick="typeKey('=')">=</div>
            <div class="key" style="background: #1e293b; color: #f87171; grid-column:span 4;" onclick="switchBoard('main')">돌아가기</div>
        </div>

        <!-- 3. 복사물 전용창 -->
        <div class="grid-layout hidden" id="clipboardBoard">
            <div class="clip-action-group">
                <button class="clip-btn btn-fetch" onclick="fetchClipboard()">📋 복사물 추가</button>
            </div>
            <div class="list-container" id="clipList"></div>
            <div class="key" style="background: #4a5568;" onclick="backspaceKey()">⌫</div>
            <div class="key" style="background: #1e293b; color: #f87171; grid-column: span 3;" onclick="switchBoard('main')">돌아가기</div>
        </div>

        <!-- 4. 상용구 전용창 -->
        <div class="grid-layout hidden" id="phrasesBoard">
            <div class="clip-action-group">
                <button class="clip-btn btn-add" onclick="addCustomText()">➕ 문구 직접추가</button>
            </div>
            <div class="list-container" id="phraseList"></div>
            <div class="key" style="background: #4a5568;" onclick="backspaceKey()">⌫</div>
            <div class="key" style="background: #1e293b; color: #f87171; grid-column: span 3;" onclick="switchBoard('main')">돌아가기</div>
        </div>
    </div>

    <script>
        const dotKey = document.getElementById('dotKey');
        const output = document.getElementById('output');
        let startX = 0, startY = 0;
        
        // 연속 밀기 감지를 위한 변수
        let lastSwipeDir = '';
        let lastSwipeTime = 0;

        dotKey.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            dotKey.style.background = '#555';
        });

        dotKey.addEventListener('touchend', (e) => {
            dotKey.style.background = '#363636';
            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;
            let threshold = 30;
            let currentTime = new Date().getTime();
            let currentDir = '';

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    currentDir = (diffX > 0) ? 'right' : 'left';
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    currentDir = (diffY > 0) ? 'down' : 'up';
                }
            }

            if (currentDir) {
                // 400밀리초(0.4초) 이내에 같은 방향으로 한 번 더 밀었는지 확인
                if (lastSwipeDir === currentDir && (currentTime - lastSwipeTime) < 400) {
                    // 두 번 밀기 (이중모음)
                    if (currentDir === 'right') output.value += 'ㅑ';
                    if (currentDir === 'left') output.value += 'ㅕ';
                    if (currentDir === 'up') output.value += 'ㅛ';
                    if (currentDir === 'down') output.value += 'ㅠ';
                    
                    lastSwipeDir = ''; // 초기화
                } else {
                    // 한 번 밀기 (기본모음)
                    if (currentDir === 'right') output.value += 'ㅏ';
                    if (currentDir === 'left') output.value += 'ㅓ';
                    if (currentDir === 'up') output.value += 'ㅗ';
                    if (currentDir === 'down') output.value += 'ㅜ';
                    
                    lastSwipeDir = currentDir;
                    lastSwipeTime = currentTime;
                }
            }
            output.focus();
        });

        function switchBoard(type) {
            document.getElementById('mainBoard').classList.add('hidden');
            document.getElementById('symbolBoard').classList.add('hidden');
            document.getElementById('clipboardBoard').classList.add('hidden');
            document.getElementById('phrasesBoard').classList.add('hidden');
            document.getElementById(type + 'Board').classList.remove('hidden');
            output.focus();
        }

        function typeKey(char) { output.value += char; output.focus(); }
        function backspaceKey() { output.value = output.value.slice(0, -1); output.focus(); }

        async function fetchClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) addItemToList('clipList', text);
                else alert("클립보드에 내용이 없습니다.");
            } catch (err) { alert("권한이 거부되었습니다."); }
        }

        function addCustomText() {
            let text = prompt("추가할 상용구를 입력하세요:");
            if (text) addItemToList('phraseList', text);
        }

        function addItemToList(listId, text) {
            const list = document.getElementById(listId);
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${text}</span>`;
            item.onclick = () => typeKey(text);
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }
    </script>
</body>
</html>
