<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천지인 밀기 자판</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            user-select: none;
        }
        .container {
            background: #2c2c2c;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 360px;
            box-sizing: border-box;
        }
        #output {
            width: 100%;
            height: 60px;
            font-size: 24px;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
            text-align: left;
            background-color: #383838;
            color: white;
            box-sizing: border-box;
        }
        /* 4열 키패드 그리드 */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        /* 개별 키 디자인 */
        .key {
            height: 65px;
            background: #424242;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: background 0.1s;
        }
        .key:active {
            background: #616161;
        }
        /* 각 키의 우측 상단 숫자/기호 */
        .key-num {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 11px;
            color: #9e9e9e;
            font-weight: normal;
        }
        /* 글자 색상 */
        .text-red { color: #ff5252; }
        .text-yellow { color: #ffd740; }
        .text-green { color: #69f0ae; }
        
        /* 점(•) 키 스타일 (밀기 전용) */
        .key.dot-key {
            font-size: 36px;
            background: #363636;
            border: 1px dashed #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="output" placeholder="점(•)을 동서남북으로 밀어보세요" autofocus>
        
        <div class="keyboard">
            <!-- 1행 -->
            <div class="key" onclick="typeKey('○')"><span class="text-red">○</span>ㅎ<span class="key-num">1</span></div>
            <div class="key" onclick="typeKey('ㄱ')">ㄱㅋ<span class="key-num">2</span></div>
            <div class="key" onclick="typeKey('|')">|<span class="key-num">3</span></div>
            <div class="key" style="background: #333;" onclick="backspaceKey()">⌫</div>

            <!-- 2행 -->
            <div class="key" onclick="typeKey('ㄴ')"><span class="text-yellow">ㄴ</span>ㄹ<span class="key-num">4</span></div>
            <div class="key" onclick="typeKey('ㄷ')">ㄷㅌ<span class="key-num">5</span></div>
            
            <!-- 핵심: 점(•) 키 (동서남북 밀기 적용) -->
            <div class="key dot-key" id="dotKey">•<span class="key-num">6</span></div>
            
            <div class="key" style="background: #333;">⚙️</div>

            <!-- 3행 -->
            <div class="key" onclick="typeKey('ㅅ')"><span class="text-green">ㅅ</span><span class="key-num">7</span></div>
            <div class="key" onclick="typeKey('ㅈ')">ㅈㅊ<span class="key-num">8</span></div>
            <div class="key" onclick="typeKey('—')">—<span class="key-num">9</span></div>
            <div class="key" onclick="typeKey('A')">A</div>

            <!-- 4행 -->
            <div class="key" onclick="typeKey('□')">□<span class="key-num">*</span></div>
            <div class="key" onclick="typeKey('ㅂ')">ㅂㅍ<span class="key-num">0</span></div>
            <div class="key" onclick="typeKey('‥')">‥<span class="key-num">#</span></div>
            <div class="key" onclick="typeKey(' ')">␣</div>
        </div>
    </div>

    <script>
        const dotKey = document.getElementById('dotKey');
        const output = document.getElementById('output');

        let startX = 0;
        let startY = 0;

        // 점 키 터치 시작 지점 저장
        dotKey.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            dotKey.style.background = '#555';
        });

        // 점 키 터치 종료 시 동서남북 방향 판별
        dotKey.addEventListener('touchend', (e) => {
            dotKey.style.background = '#363636';

            let endX = e.changedTouches[0].clientX;
            let endY = e.changedTouches[0].clientY;

            let diffX = endX - startX;
            let diffY = endY - startY;
            let threshold = 30; // 밀기 인식 거리 (픽셀)

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // 좌우 밀기
                if (Math.abs(diffX) > threshold) {
                    if (diffX > 0) {
                        output.value += 'ㅏ'; // 우측 밀기 -> ㅏ
                    } else {
                        output.value += 'ㅓ'; // 좌측 밀기 -> ㅓ
                    }
                }
            } else {
                // 상하 밀기
                if (Math.abs(diffY) > threshold) {
                    if (diffY > 0) {
                        output.value += 'ㅜ'; // 아래 밀기 -> ㅜ
                    } else {
                        output.value += 'ㅗ'; // 위 밀기 -> ㅗ
                    }
                }
            }
            output.focus();
        });

        // 일반 버튼 클릭 시 입력
        function typeKey(char) {
            output.value += char;
            output.focus();
        }

        // 지우기 버튼
        function backspaceKey() {
            output.value = output.value.slice(0, -1);
            output.focus();
        }
    </script>

</body>
</html>
