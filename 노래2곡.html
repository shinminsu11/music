<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설계원리</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 이미지 영역 */
        .image-box {
            width: 100%;
            max-width: 650px; 
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            text-align: center;
        }
        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.3s ease;
        }

        /* 플레이어 상단 통합 타이틀 영역 */
        .player-header {
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .now-playing {
            font-size: 13px;
            color: #a0a0a0;
        }
        .now-playing span {
            color: #4facfe;
            font-weight: bold;
        }

        /* 탭 버튼 영역 */
        .tab-buttons {
            display: flex;
            width: 100%;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2c2c2e;
            color: #a0a0a0;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            box-shadow: 0 4px 10px rgba(79, 172, 254, 0.4);
        }

        /* 오디오 플레이어 */
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 30px;
        }

        /* 가사 출력 박스 */
        .lyrics-box {
            width: 100%;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .lyrics-box h3 {
            margin-top: 0;
            color: #4facfe;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .lyrics-content {
            white-space: pre-line;
            line-height: 2.6;
            color: #e0e0e0;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 이미지 표시 영역 -->
    <div class="image-box">
        <img id="content-image" src="a.png" alt="설계도 이미지">
    </div>

    <!-- 통합된 타이틀 및 재생 정보 영역 -->
    <div class="player-header">
        <div class="section-title">애초말 음악 플레이어</div>
        <div class="now-playing">현재 재생 중 : <span id="current-song-name">아라비아숫자 모양</span></div>
    </div>

    <!-- 곡 전환 탭 버튼 영역 -->
    <div class="tab-buttons">
        <button id="btn-a" class="tab-btn active" onclick="switchContent('a', true)">🎵 아라비아숫자 모양</button>
        <button id="btn-b" class="tab-btn" onclick="switchContent('b', true)">🎵 서로 바라보는 소리</button>
    </div>

    <!-- 오디오 플레이어 -->
    <audio id="audio-player" controls>
        <source id="audio-source" src="a.mp3" type="audio/mp3">
        브라우저가 오디오 태그를 지원하지 않습니다.
    </audio>

    <!-- 가사 박스 -->
    <div class="lyrics-box">
        <h3 id="lyrics-title">가사 - 아라비아숫자 모양</h3>
        <div id="lyrics-content" class="lyrics-content"></div>
    </div>
</div>

<script>
    const songData = {
        a: {
            image: "아라비아1.png",
            audio: "아라비아1.mp3",
            title: "아라비아숫자 모양",
            lyrics: `
일이삼사오육칠팔구십
아라비아 숫자의 비밀 

​(Verse 1)
꽉 찬 무에서 시작된 파동
음과 양이 갈라지며 첫 대칭이 열렸네
 
 왼손과 오른손 사이에서 태동하는
 아라비아 숫자 모양이 그려지는 원리
 
 하나 둘 천이삼
 오른손 첫양 직각자의 모양 칠(7)과 왼손 첫음 콤파스의 모양 사(4)
 
 
 ​(Chorus)
 아라비아 숫자는 무작위가 아니야
 우주가 그린 차원의 기하학적 설계도
 천이삼 지이삼 인이삼의 고리 따라
 음양으로 갈라지며 돌고 도는 태극의 엔진  
 
 ​(Verse 2)
 
 셋 넷 지이삼
 동과 서는 수평으로 넓게 펼쳐저서
 좌우대칭 양태극 오(5)와 음태극 이(2)가 그려진다
 
 다섯 여섯 인이삼
 남과 북은 수직으로 솟구처
 상하대칭 양태극 구(9)와 음태극 육(6)이 그려진다
 
 ​(Chorus)
 아라비아 숫자는 무작위가 아니야
 우주가 그린 차원의 기하학적 설계도
 천이삼 지이삼 인이삼의 고리 따라
 음양이 갈라지며 돌고 도는 태극의 엔진  
 
 ​(Bridge)
 일곱 여덟 반양 반음
 양태극의 엮행 삼(3)과 음태극의 역행 팔(8)의 모양이 그려진다
 
 아홉 열 중심 무극
 중심이 서는 모양 일(1)
 모든 것을 어우르는 영(0)이 그려진다
 
 ​(Outro)
 하나에서 열까지 뻗어 나간 천부의 소리원리 파동
 아라비아 숫자 속에 숨겨진 비밀의 문
 마침내 태극이 돌아가며 열리네
 
 태극 엔진은 멈추지 않고 돌고  돌아간다 돌아간다 돌아간다`
        },
        b: {
            image: "복희.png",
            audio: "face.mp3",
            title: "서로 바라보는 소리",
            lyrics: `
[Verse 1]
처음엔 아무 말도 없었지
그저 숨과 떨림뿐
어둠 속에서 부딪힌 울림
그중 살아남은 건 단 하나의 리듬
소리는 흘러, 사라지고 남아
자연과 맞는 것만 남아
입 안에서 태어난 작은 우주
그걸 우린 언어라 불러

[Pre-Chorus]
형태를 만들는 선
직선과 곡선
서로 다른 길 위에 서 있지만
결국 하나를 향해 가

[Chorus]
좌에서 우로, 우에서 좌로
서로를 바라보는 소리
여는 것과 닫는 것 사이
그 틈에서 태어난 우리
직선은 말해 “나는 경계”
곡선은 말해 “나는 흐름”
둘이 만나 완성되는 순간
그게 바로 한글의 궤적

[Verse 2]
모음은 공간의 방향 좌표
아는 열려 앞으로
어는 반대로 안으로
오는 솟는 숨결
우는 아래로 가라앉는 파도

자음은 경계를 나눔
기역은 꺾이고, 
니은은 내리고,
비읍은 뿌리고,
미음은 모으고, 
선을 그어
세상을 구조로 만든다

[Pre-Chorus 2]
모음은 흐르고 자음은 만들어
서로 다른 두 개의 시작
근데 같은 끝을 향해

[Chorus]
좌에서 우로, 우에서 좌로
서로를 바라보는 소리
남과 여, 음과 양처럼
마주 선 두 개의 진리
곡선은 말해 “나는 생명”
직선은 말해 “나는 형태”
둘이 만나 숨 쉬는 순간
그게 바로 우리의 언어

[Bridge]
보이지 않는 입이 두 개
서로를 향해 말하고 있어
하나는 틀을 만들고
하나는 그 안을 채워
공(空) 속에서 시작된 원
이응은 아무것도 아닌 전부
비어 있음이 열어주는 길
그 안에 모든 게 숨 쉬어

[Break]
흐름과 구조
살아있는 리듬
좌우 대칭, 서로 다른 시선
두 개의 세계가 만든 이 시스템
자음은 뼈대, 모음은 피
서로가 없으면 완성은 없지
코드처럼 돌아가는 이 구조

[Final Chorus]
좌에서 우로, 우에서 좌로
서로를 끌어당기는 소리
끊어진 듯 이어진 흐름
그 안에 담긴 우리의 이야기
직선과 곡선이 만난 자리
시작과 끝이 겹친 순간
그 음과 양이 하나가 될 때
우린 미래를 말하게 돼`
        }
    };

    let currentType = 'a';

    function switchContent(type, playAudio = false) {
        currentType = type;
        const data = songData[type];
        
        document.getElementById('content-image').src = data.image;
        
        const audioPlayer = document.getElementById('audio-player');
        const audioSource = document.getElementById('audio-source');
        audioSource.src = data.audio;
        audioPlayer.load();
        
        if (playAudio) {
            audioPlayer.play().catch(e => console.log("자동 재생 제한:", e));
        }
        
        document.getElementById('current-song-name').innerText = data.title;
        document.getElementById('lyrics-title').innerText = "가사 - " + data.title;
        document.getElementById('lyrics-content').innerText = data.lyrics;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (type === 'a') document.getElementById('btn-a').classList.add('active');
        if (type === 'b') document.getElementById('btn-b').classList.add('active');
    }

    const audioPlayer = document.getElementById('audio-player');
    audioPlayer.addEventListener('ended', function() {
        if (currentType === 'a') {
            switchContent('b', true);
        } else {
            switchContent('a', true);
        }
    });

    window.onload = function() {
        switchContent('a', false);
    };
</script>

</body>
</html>
