<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애초말 노래 플레이어</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 이미지 영역 */
        .image-box {
            width: 100%;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            text-align: center;
        }
        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.3s ease;
        }

        /* 플레이어 상단 통합 타이틀 영역 */
        .player-header {
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .now-playing {
            font-size: 13px;
            color: #a0a0a0;
        }
        .now-playing span {
            color: #4facfe;
            font-weight: bold;
        }

        /* 탭 버튼 영역 */
        .tab-buttons {
            display: flex;
            width: 100%;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2c2c2e;
            color: #a0a0a0;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            box-shadow: 0 4px 10px rgba(79, 172, 254, 0.4);
        }

        /* 오디오 플레이어 */
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 30px;
        }

        /* 가사 출력 박스 */
        .lyrics-box {
            width: 100%;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .lyrics-box h3 {
            margin-top: 0;
            color: #4facfe;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .lyrics-content {
            white-space: pre-line;
            line-height: 1.6;
            color: #e0e0e0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 이미지 표시 영역 -->
    <div class="image-box">
        <img id="content-image" src="a.png" alt="설계도 이미지">
    </div>

    <!-- 통합된 타이틀 및 재생 정보 영역 -->
    <div class="player-header">
        <div class="section-title">애초말 음악 플레이어</div>
        <div class="now-playing">현재 재생 중 : <span id="current-song-name">아라비아숫자 모양</span></div>
    </div>

    <!-- 곡 전환 탭 버튼 영역 -->
    <div class="tab-buttons">
        <button id="btn-a" class="tab-btn active" onclick="switchContent('a', true)">🎵 아라비아숫자 모양</button>
        <button id="btn-b" class="tab-btn" onclick="switchContent('b', true)">🎵 서로 바라보는 소리</button>
    </div>

    <!-- 오디오 플레이어 -->
    <audio id="audio-player" controls>
        <source id="audio-source" src="a.mp3" type="audio/mp3">
        브라우저가 오디오 태그를 지원하지 않습니다.
    </audio>

    <!-- 가사 박스 -->
    <div class="lyrics-box">
        <h3 id="lyrics-title">가사 - 아라비아숫자 모양</h3>
        <div id="lyrics-content" class="lyrics-content"></div>
    </div>
</div>

<script>
    const songData = {
        a: {
            image: "아라비아1.png",
            audio: "아라비아1.mp3",
            title: "아라비아숫자 모양",
            lyrics: `일이삼사오육칠팔구십
아라비아 숫자의 비밀 

(Verse 1)
꽉 찬 무에서 시작된 파동
음과 양이 갈라지며 첫 대칭이 열렸네
 
왼손과 오른손 사이에서 태동하는
아라비아 숫자 모양이 그려지는 원리

하나 둘 천이삼
오른손 첫양 직각자의 모양 칠(7)과 왼손 첫음 콤파스의 모양 사(4)`
        },
        b: {
            image: "복희.png",
            audio: "face.mp3",
            title: "서로 바라보는 소리",
            lyrics: `[Verse 1]
처음엔 아무 말도 없었지
그저 숨과 떨림뿐
어둠 속에서 부딪힌 울림
그중 살아남은 건 단 하나의 리듬
소리는 흘러, 사라지고 남아
자연과 맞는 것만 남아`
        }
    };

    let currentType = 'a';

    function switchContent(type, playAudio = false) {
        currentType = type;
        const data = songData[type];
        
        document.getElementById('content-image').src = data.image;
        
        const audioPlayer = document.getElementById('audio-player');
        const audioSource = document.getElementById('audio-source');
        audioSource.src = data.audio;
        audioPlayer.load();
        
        if (playAudio) {
            audioPlayer.play().catch(e => console.log("자동 재생 제한:", e));
        }
        
        document.getElementById('current-song-name').innerText = data.title;
        document.getElementById('lyrics-title').innerText = "가사 - " + data.title;
        document.getElementById('lyrics-content').innerText = data.lyrics;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (type === 'a') document.getElementById('btn-a').classList.add('active');
        if (type === 'b') document.getElementById('btn-b').classList.add('active');
    }

    const audioPlayer = document.getElementById('audio-player');
    audioPlayer.addEventListener('ended', function() {
        if (currentType === 'a') {
            switchContent('b', true);
        } else {
            switchContent('a', true);
        }
    });

    window.onload = function() {
        switchContent('a', false);
    };
</script>

</body>
</html>
