<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>애초말 음악 3곡</title>

<style>
body {
    background:#121214;
    color:#e4e4e7;
    font-family:'Malgun Gothic',sans-serif;
    max-width:600px;
    margin:0 auto;

    text-align:center;
}

.image-container {
    margin:20px 0;

    padding:10px;

    box-shadow:0 4px 15px rgba(0,0,0,.5);

img {

    height:auto;
    border-radius:8px;
}

h1 {

    margin:30px 0 20px;
    color:#fff;
}

.playlist {
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.track-btn {
    flex:1;
    background:#26262b;
    color:#a1a1aa;
    border:none;

    border-radius:16px;
    font-size:.95rem;
    font-weight:bold;
    cursor:pointer;
}

.track-btn.active {

    color:#fff;
    box-shadow:0 4px 12px rgba(59,130,246,.4);
}

.now-playing {
    background:#1a1a1e;
    padding:14px;
    border-radius:12px;
    font-size:.95rem;
    color:#a1a1aa;
    margin-bottom:15px;
}

.now-playing span {
    color:#fbbf24;
    font-weight:bold;
}

audio {
    width:100%;
    margin-bottom:20px;
}

.lyrics-container {
    background:#1a1a1e;
    padding:25px;
    border-radius:16px;
    text-align:left;
    white-space:pre-wrap;
    font-size:.95rem;
    line-height:1.7;
    color:#d4d4d8;
    max-height:500px;
    overflow-y:auto;
}

.lyrics-container .current {
    color:#3b82f6;
    font-weight:bold;
    text-shadow:0 0 8px rgba(59,130,246,.7);

.loop-status {

    color:#a1a1aa;

</head>

<div class="image-container">
    <img src="taegeuk.png" alt="태극 음악">
</div>

<h1>애초말 음악 3곡</h1>

<div class="playlist">

<button class="track-btn active" id="btn-1"
onclick="selectTrack(1)">
🎵 애초말파동1
</button>

<button class="track-btn" id="btn-2"
onclick="selectTrack(2)">
🎵 애초말파동2
</button>

<button class="track-btn" id="btn-3"
onclick="selectTrack(3)">
🎵 애초말엔진
</button>

</div>

<div class="now-playing">
현재 재생 중 :
<span id="current-title">애초말파동1</span>
</div>

<div class="loop-status">
🔁 1 → 2 → 3 → 1 → 2 → 3 무한 반복
</div>

<audio id="audio-player" controls>
<source id="audio-source"
src="acho1.mp3"
type="audio/mpeg">
브라우저가 오디오 태그를 지원하지 않습니다.

];


/* =====================================================
   현재 곡
===================================================== */

let currentTrack = 0;


/* =====================================================
   가사 표시
===================================================== */

function showLyrics(track, currentTime) {

    const box =
        document.getElementById("lyrics-display");

    const total =
        track.duration;

    const count =
        track.lyrics.length;

    let index =
        Math.floor((currentTime / total) * count);

    if(index < 0) index = 0;

    if(index >= count)
        index = count - 1;

    box.innerHTML = "";

    track.lyrics.forEach(function(text,i){

        const line =
            document.createElement("div");

        line.innerText = text;

        if(i === index)
            line.className = "current";

        box.appendChild(line);
    });

}


/* =====================================================
   곡 선택
===================================================== */

function selectTrack(trackNumber, autoPlay=true){

    const index =
        trackNumber - 1;

    if(index < 0 || index >= tracks.length)
        return;

    currentTrack = index;

    const track =
        tracks[index];

    document.getElementById("current-title")
        .innerText = track.title;

    document.getElementById("audio-source")
        .src = track.src;

    document
        .querySelectorAll(".track-btn")
        .forEach(function(button,i){

            button.classList.toggle(
                "active",
                i === index
            );

        });

    const player =
        document.getElementById("audio-player");

    player.load();

    showLyrics(track,0);

    if(autoPlay){

        player.play().catch(function(){});

    }

}


/* =====================================================
   재생 시간에 따라 가사 변경
===================================================== */

const player =
    document.getElementById("audio-player");

player.addEventListener(
    "timeupdate",
    function(){

        const track =
            tracks[currentTrack];

        showLyrics(
            track,
            player.currentTime
        );

    }
);


/* =====================================================
   ★ 무한 반복
   1 → 2 → 3 → 1 → 2 → 3
===================================================== */

player.addEventListener(
    "ended",
    function(){

        let next =
            (currentTrack + 1)
            % tracks.length;

        selectTrack(
            next + 1,
            true
        );

    }
);


/* =====================================================
   처음 실행
===================================================== */

selectTrack(1,false);

</script>

</html>
