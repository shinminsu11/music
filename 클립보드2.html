<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천지인 밀기 자판 (다중 클립보드)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            user-select: none;
        }
        .container {
            background: #2c2c2c;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 360px;
            box-sizing: border-box;
        }
        #output {
            width: 100%;
            height: 60px;
            font-size: 24px;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
            text-align: left;
            background-color: #383838;
            color: white;
            box-sizing: border-box;
        }
        .keyboard, .symbol-board, .clipboard-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .hidden {
            display: none !important;
        }
        .key {
            height: 65px;
            background: #424242;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: background 0.1s;
        }
        .key:active {
            background: #616161;
        }
        .key-num {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 11px;
            color: #9e9e9e;
            font-weight: normal;
        }
        .text-red { color: #ff5252; }
        .text-yellow { color: #ffd740; }
        .text-green { color: #69f0ae; }
        
        .key.dot-key {
            font-size: 36px;
            background: #363636;
            border: 1px dashed #777;
        }
        .sub-key {
            background: #334155;
            color: #38bdf8;
            font-size: 18px;
        }
        /* 클립보드 스크롤 영역을 위한 컨테이너 */
        .clipboard-container {
            grid-column: span 4;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
        }
        .clip-item {
            width: 100%;
            height: 45px;
            font-size: 14px;
            background: #1e293b;
            color: #e2e8f0;
            padding: 5px 10px;
            box-sizing: border-box;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .clip-item:active {
            background: #334155;
        }
        .clip-action {
            grid-column: span 4;
            background: #0284c7;
            color: white;
            font-size: 15px;
            height: 45px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .clip-action:active {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="output" placeholder="자판을 테스트해보세요" autofocus>
        
        <!-- 1. 메인 한글/밀기 자판 -->
        <div class="keyboard" id="mainKeyboard">
            <div class="key" onclick="typeKey('○')"><span class="text-red">○</span>ㅎ<span class="key-num">1</span></div>
            <div class="key" onclick="typeKey('ㄱ')">ㄱㅋ<span class="key-num">2</span></div>
            <div class="key" onclick="typeKey('|')">|<span class="key-num">3</span></div>
            <div class="key" style="background: #333;" onclick="backspaceKey()">⌫</div>

            <div class="key" onclick="typeKey('ㄴ')"><span class="text-yellow">ㄴ</span>ㄹ<span class="key-num">4</span></div>
            <div class="key" onclick="typeKey('ㄷ')">ㄷㅌ<span class="key-num">5</span></div>
            <div class="key dot-key" id="dotKey">•<span class="key-num">6</span></div>
            <div class="key" style="background: #333;" onclick="switchBoard('symbol')">⚙️</div>

            <div class="key" onclick="typeKey('ㅅ')"><span class="text-green">ㅅ</span><span class="key-num">7</span></div>
            <div class="key" onclick="typeKey('ㅈ')">ㅈㅊ<span class="key-num">8</span></div>
            <div class="key" onclick="typeKey('—')">—<span class="key-num">9</span></div>
            <div class="key" onclick="typeKey('A')">A</div>

            <div class="key" onclick="typeKey('□')">□<span class="key-num">*</span></div>
            <div class="key" onclick="typeKey('ㅂ')">ㅂㅍ<span class="key-num">0</span></div>
            <div class="key" style="background: #333; color: #38bdf8;" onclick="switchBoard('clipboard')">📋</div>
            <div class="key" onclick="typeKey(' ')">␣</div>
        </div>

        <!-- 2. 기호판 -->
        <div class="symbol-board hidden" id="symbolBoard">
            <div class="key sub-key" onclick="typeKey('!')">!</div>
            <div class="key sub-key" onclick="typeKey('@')">@</div>
            <div class="key sub-key" onclick="typeKey('#')">#</div>
            <div class="key sub-key" onclick="typeKey('$')">$</div>

            <div class="key sub-key" onclick="typeKey('%')">%</div>
            <div class="key sub-key" onclick="typeKey('^')">^</div>
            <div class="key sub-key" onclick="typeKey('&')">&</div>
            <div class="key sub-key" onclick="typeKey('*')">*</div>

            <div class="key sub-key" onclick="typeKey('(')">(</div>
            <div class="key sub-key" onclick="typeKey(')')">)</div>
            <div class="key sub-key" onclick="typeKey('+')">+</div>
            <div class="key sub-key" onclick="typeKey('-')">-</div>

            <div class="key" style="background: #4a5568;" onclick="backspaceKey()">⌫</div>
            <div class="key sub-key" onclick="typeKey('?')">?</div>
            <div class="key sub-key" onclick="typeKey('=')">=</div>
            <div class="key" style="background: #1e293b; color: #f87171;" onclick="switchBoard('main')">돌아가기</div>
        </div>

        <!-- 3. 다중 클립보드 판 (복사한 내용이 아래로 누적됨) -->
        <div class="clipboard-board hidden" id="clipboardBoard">
            <button class="clip-action" onclick="fetchClipboard()">📋 복사한 내용 추가하기</button>
            
            <!-- 누적된 항목들이 쌓이는 장소 -->
            <div class="clipboard-container" id="clipList">
                <div class="clip-item" onclick="typeKey('기본 문구: 안녕하세요')">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">기본 문구: 안녕하세요</span>
                </div>
            </div>

            <div class="key" style="background: #4a5568; height: 45px;" onclick="backspaceKey()">⌫</div>
            <div class="key" style="background: #1e293b; color: #f87171; grid-column: span 3; height: 45px; font-size: 16px;" onclick="switchBoard('main')">자판으로 돌아가기</div>
        </div>
    </div>

    <script>
        const dotKey = document.getElementById('dotKey');
        const output = document.getElementById('output');
        const mainKeyboard = document.getElementById('mainKeyboard');
        const symbolBoard = document.getElementById('symbolBoard');
        const clipboardBoard = document.getElementById('clipboardBoard');

        let startX = 0;
        let startY = 0;

        dotKey.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            dotKey.style.background = '#555';
        });

        dotKey.addEventListener('touchend', (e) => {
            dotKey.style.background = '#363636';
            let endX = e.changedTouches[0].clientX;
            let endY = e.changedTouches[0].clientY;
            let diffX = endX - startX;
            let diffY = endY - startY;
            let threshold = 30;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    if (diffX > 0) { output.value += 'ㅏ'; } 
                    else { output.value += 'ㅓ'; }
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    if (diffY > 0) { output.value += 'ㅜ'; } 
                    else { output.value += 'ㅗ'; }
                }
            }
            output.focus();
        });

        function switchBoard(type) {
            mainKeyboard.classList.add('hidden');
            symbolBoard.classList.add('hidden');
            clipboardBoard.classList.add('hidden');

            if (type === 'main') {
                mainKeyboard.classList.remove('hidden');
            } else if (type === 'symbol') {
                symbolBoard.classList.remove('hidden');
            } else if (type === 'clipboard') {
                clipboardBoard.classList.remove('hidden');
            }
            output.focus();
        }

        function typeKey(char) {
            output.value += char;
            output.focus();
        }

        function backspaceKey() {
            output.value = output.value.slice(0, -1);
            output.focus();
        }

        // 복사한 내용을 가져와서 목록 아래에 계속 누적시키는 함수
        async function fetchClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    const clipList = document.getElementById('clipList');
                    
                    // 중복 입력 방지를 원하면 체크할 수 있지만, 우선 누적되도록 구현
                    const newItem = document.createElement('div');
                    newItem.className = 'clip-item';
                    newItem.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${text}</span>`;
                    newItem.onclick = () => typeKey(text);
                    
                    // 목록의 맨 아래에 차곡차곡 추가 (누적)
                    clipList.appendChild(newItem);
                    
                    // 스크롤을 가장 아래로 내려서 새로 추가된 게 보이도록 함
                    clipList.scrollTop = clipList.scrollHeight;
                } else {
                    alert("클립보드에 복사된 내용이 없습니다.");
                }
            } catch (err) {
                alert("클립보드 권한이 거부되었거나 지원하지 않는 환경입니다.");
            }
        }
    </script>

</body>
</html>
